<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-200 flex items-center justify-center h-screen">
    <div class="w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg mx-auto rounded-xl shadow-lg bg-gray-100 p-2">
        <div class="bg-gray-800 text-white rounded-lg p-4 text-right mb-2">
            <input type="text" id="result" class="w-full bg-transparent text-4xl font-light tracking-wider" disabled>
        </div>
        <div class="grid grid-cols-4 gap-2">
            <button onclick="clearScreen()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 text-2xl rounded-lg">C</button>
            <button onclick="del()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-4 text-2xl rounded-lg">DEL</button>
            <button onclick="display('%')" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-4 text-2xl rounded-lg">%</button>
            <button onclick="display('/')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 text-2xl rounded-lg">/</button>

            <button onclick="display('7')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">7</button>
            <button onclick="display('8')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">8</button>
            <button onclick="display('9')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">9</button>
            <button onclick="display('*')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 text-2xl rounded-lg">*</button>

            <button onclick="display('4')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">4</button>
            <button onclick="display('5')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">5</button>
            <button onclick="display('6')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">6</button>
            <button onclick="display('-')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 text-2xl rounded-lg">-</button>

            <button onclick="display('1')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">1</button>
            <button onclick="display('2')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">2</button>
            <button onclick="display('3')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">3</button>
            <button onclick="display('+')" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 text-2xl rounded-lg">+</button>

            <button onclick="display('0')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg col-span-2">0</button>
            <button onclick="display('.')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 text-2xl rounded-lg">.</button>
            <button onclick="calculate()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 text-2xl rounded-lg">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
